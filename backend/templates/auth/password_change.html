{% extends "base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="page-heading"><div><span class="eyebrow">SEGURIDAD DE LA CUENTA</span><h1>Cambiar contraseña</h1><p>Actualiza tu clave para continuar.</p></div></div>
<form method="post" class="form-section form-stack">{% csrf_token %}
  {% if form.non_field_errors %}<div class="form-errors">{{ form.non_field_errors }}</div>{% endif %}
  {{ form.as_p }}
  <div class="form-actions"><button type="submit" class="button button-primary">Actualizar contraseña</button></div>
</form>
{% endblock %}
