{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
  <h1>Restablecer contraseña</h1>
  <p>{{ ticket.estudiante.get_full_name }} · {{ ticket.estudiante.identification }}</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="submit-row">
      <input type="submit" value="Guardar nueva clave y resolver ticket" class="default">
      <a href="{% url 'dashboard' %}">Cancelar</a>
    </div>
  </form>
{% endblock %}
