{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="submit-row">
      <input type="submit" value="{{ submit_label }}" class="default">
      <a href="{% url 'admin:evaluaciones_curso_changelist' %}">Cancelar</a>
    </div>
  </form>
{% endblock %}
